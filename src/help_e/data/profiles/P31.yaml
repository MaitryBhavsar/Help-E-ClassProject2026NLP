seed_situation_paragraph: I'm a 38-year-old project manager and I've been drinking 4–6
  drinks most nights for the past two years. It started as a way to decompress after
  long workdays, but lately my wife has started asking me to cut back and I've been
  showing up at meetings less sharp than I used to be. I keep telling myself I can stop
  whenever I want, but the truth is I haven't gone more than two days without a drink
  in I don't know how long. Part of me thinks it's not really a problem; part of me
  is worried about my marriage and my work, and worried about what it means that I
  don't seem able to put it down.
primary_problem: alcohol_reduction
