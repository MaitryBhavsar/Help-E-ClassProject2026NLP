seed_situation_paragraph: I'm a junior in college, 22, and I've been smoking weed pretty
  much daily for three years. It started as something I did with friends on weekends
  and slowly became my whole evening routine. My grades have been slipping for the
  past two semesters and I just got a letter putting me on academic probation. My parents
  don't know yet. I keep telling myself it's just weed and it's helping me with stress,
  but a friend stopped using last year and a few weeks ago told me I seemed "different
  in a bad way" — and I haven't been able to stop thinking about it since. I'm not
  sure if I want to cut back or quit completely, but I know what I'm doing right now
  isn't working.
primary_problem: drug_use_reduction
