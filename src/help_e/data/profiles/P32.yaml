seed_situation_paragraph: I've been smoking for about 15 years, started in college and
  it just stuck. I'm 42 now with two kids — my oldest is seven and last week she asked
  me why I smell like cigarettes. My GP flagged early signs of COPD at my last checkup
  and said the next decade matters. I've quit twice before — once for three months when
  my wife was pregnant, once for a couple of weeks last New Year's — and both times
  I was back to a pack a day within a month. I want to quit, but I also feel like I've
  proved to myself that I can't, and I'm scared to try again and fail in front of the
  kids.
primary_problem: smoking_cessation
session_arc:
- 'session 1: establish wanting to quit; surface perceived severity (COPD, kids) and barriers'
- 'session 2: explore past quit attempts; first TTM move if natural'
- 'session 3: introduce parenting / role-model concern; progress on plan'
- 'session 4: deeper work on coping for cravings; relapse prevention'
